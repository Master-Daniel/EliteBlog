name: Elite-Blog Frontend Deployment

on:
  push:
    branches:
      - frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lockfile path for cache
        id: lockfile
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "path=frontend/package-lock.json" >> $GITHUB_OUTPUT
            echo "wd=frontend" >> $GITHUB_OUTPUT
          else
            echo "path=package-lock.json" >> $GITHUB_OUTPUT
            echo "wd=." >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Install dependencies
        run: |
          cd ${{ steps.lockfile.outputs.wd }} && npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: cd ${{ steps.lockfile.outputs.wd }} && npm run build
        env:
          CI: 'true'
          VITE_FRONTEND_URL: https://${{ secrets.FRONTEND_DOMAIN || 'the-eliteblog.com' }}
          VITE_API_URL: https://${{ secrets.BACKEND_API_DOMAIN || 'api.the-eliteblog.com' }}
          VITE_BASE_URL: https://${{ secrets.BACKEND_API_DOMAIN || 'api.the-eliteblog.com' }}/api
          VITE_GITHUB_REDIRECT_URI: https://${{ secrets.BACKEND_API_DOMAIN || 'api.the-eliteblog.com' }}/api/auth/github/callback

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ steps.lockfile.outputs.wd }}/dist/

      - name: Add SSH key for deploy (optional private deps)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

  deploy_production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/frontend' || github.ref == 'refs/heads/frontend_v1.0'
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      DEPLOY_PATH: /var/www/elite-blog/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Set frontend deploy path (monorepo vs root)
        id: frontend-path
        run: |
          if [ -f frontend/package.json ]; then
            echo "subdir=frontend" >> $GITHUB_OUTPUT
          else
            echo "subdir=." >> $GITHUB_OUTPUT
          fi

      - name: Add SSH key for deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.SERVER_IP }}" ] || [ -z "${{ secrets.USER }}" ]; then
            echo "::error::Missing required secrets. Add SERVER_IP and USER in repo Settings → Secrets and variables → Actions."
            echo "Required: SSH_KEY, SERVER_IP, USER. Optional: SSH_PORT (default 22)."
            exit 1
          fi

      - name: Verify SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.USER }}@${{ secrets.SERVER_IP }} 'echo "SSH connection successful"'

      - name: Update repo on server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.USER }}@${{ secrets.SERVER_IP }} \
            "TARGET_BRANCH=$TARGET_BRANCH DEPLOY_PATH=$DEPLOY_PATH REPO=${{ github.repository }} DEPLOY_USER=${{ secrets.USER }} bash -s" << 'EOF'
            set -e
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              echo "First-time deployment - cloning repository (public)..."
              sudo mkdir -p "${DEPLOY_PATH}"
              sudo git clone "https://github.com/${REPO}.git" "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}" && sudo git checkout "${TARGET_BRANCH}"
              echo "Repository cloned."
            else
              cd "${DEPLOY_PATH}"
              sudo git config --global --add safe.directory "${DEPLOY_PATH}" || true
              sudo git fetch origin "${TARGET_BRANCH}"
              sudo git reset --hard "origin/${TARGET_BRANCH}"
              sudo git clean -fd -e node_modules
            fi
            sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} "${DEPLOY_PATH}" 2>/dev/null || true
          EOF

      - name: Rsync dist to server
        run: |
          # Sync to both possible locations so script finds dist whether repo root or frontend/ subdir
          for DEST in "${{ env.DEPLOY_PATH }}/dist" "${{ env.DEPLOY_PATH }}/frontend/dist"; do
            rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }}" \
              ./frontend-dist/ \
              ${{ secrets.USER }}@${{ secrets.SERVER_IP }}:${DEST}/
          done

      - name: Configure Apache and finish deploy
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN || 'the-eliteblog.com' }}
          BACKEND_API_DOMAIN: ${{ secrets.BACKEND_API_DOMAIN || 'api.the-eliteblog.com' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PATH=$DEPLOY_PATH FRONTEND_DOMAIN=$FRONTEND_DOMAIN BACKEND_API_DOMAIN=$BACKEND_API_DOMAIN SKIP_BUILD=1 bash -s" << 'EOF'
            set -e
            # Resolve which dist has index.html (we rsync to both)
            WEB_ROOT_ABS=""
            for D in "${DEPLOY_PATH}/dist" "${DEPLOY_PATH}/frontend/dist"; do
              if [ -f "${D}/index.html" ]; then
                WEB_ROOT_ABS="$(cd "${D}" && pwd)"
                echo "Using dist: ${WEB_ROOT_ABS}"
                break
              fi
            done
            if [ -z "${WEB_ROOT_ABS}" ]; then
              echo "::error::No index.html found in ${DEPLOY_PATH}/dist or ${DEPLOY_PATH}/frontend/dist. Rsync may have failed."
              exit 1
            fi
            # Ensure Apache can read and SPA routing works
            chmod -R o+rX "${WEB_ROOT_ABS}" 2>/dev/null || sudo chmod -R o+rX "${WEB_ROOT_ABS}"
            printf '%s\n' 'RewriteEngine On' 'RewriteBase /' 'RewriteRule ^index\.html$ - [L]' 'RewriteCond %{REQUEST_FILENAME} !-f' 'RewriteCond %{REQUEST_FILENAME} !-d' 'RewriteRule . /index.html [L]' > "${WEB_ROOT_ABS}/.htaccess"

            # Try orchestrator script first; if missing, configure Apache inline so site still works
            if [ -f "${DEPLOY_PATH}/frontend/scripts/deploy-orchestrator.sh" ]; then
              SCRIPT="${DEPLOY_PATH}/frontend/scripts/deploy-orchestrator.sh"
              APP_DIR="${DEPLOY_PATH}/frontend"
              chmod +x "${SCRIPT}"
              cd "${APP_DIR}" && export FRONTEND_DOMAIN BACKEND_API_DOMAIN SKIP_BUILD && ./scripts/deploy-orchestrator.sh production
            elif [ -f "${DEPLOY_PATH}/scripts/deploy-orchestrator.sh" ]; then
              SCRIPT="${DEPLOY_PATH}/scripts/deploy-orchestrator.sh"
              APP_DIR="${DEPLOY_PATH}"
              chmod +x "${SCRIPT}"
              cd "${APP_DIR}" && export FRONTEND_DOMAIN BACKEND_API_DOMAIN SKIP_BUILD && ./scripts/deploy-orchestrator.sh production
            else
              echo "::warning::No deploy-orchestrator.sh found; configuring Apache from workflow (fallback)."
              APACHE_SITE_ID="${APACHE_SITE_ID:-elite-blog-frontend}"
              if [ -d /etc/apache2 ]; then
                APACHE_CONF="/etc/apache2/sites-available/${APACHE_SITE_ID}.conf"
              elif [ -d /etc/httpd ]; then
                APACHE_CONF="/etc/httpd/conf.d/${APACHE_SITE_ID}.conf"
              else
                APACHE_CONF=""
              fi
              if [ -n "${APACHE_CONF}" ]; then
                {
                  echo '<VirtualHost *:80>'
                  echo "    ServerName ${FRONTEND_DOMAIN}"
                  echo "    DocumentRoot ${WEB_ROOT_ABS}"
                  echo "    <Directory \"${WEB_ROOT_ABS}\">"
                  echo '        Options -Indexes +FollowSymLinks'
                  echo '        AllowOverride All'
                  echo '        Require all granted'
                  echo '        FallbackResource /index.html'
                  echo '    </Directory>'
                  echo '</VirtualHost>'
                } | sudo tee "${APACHE_CONF}" >/dev/null
                if [ -d /etc/apache2 ] && [ -x /usr/sbin/a2ensite ]; then
                  sudo a2ensite "${APACHE_SITE_ID}" 2>/dev/null || true
                  sudo a2dissite 000-default 2>/dev/null || true
                  sudo a2enmod rewrite 2>/dev/null || true
                fi
                sudo apache2ctl configtest 2>/dev/null && sudo systemctl reload apache2 2>/dev/null || \
                sudo apachectl configtest 2>/dev/null && sudo systemctl reload httpd 2>/dev/null || true
              fi
            fi
            echo "--- Verifying deployment ---"
            echo "OK: ${WEB_ROOT_ABS}/index.html"
            ls -la "${WEB_ROOT_ABS}/" | head -5
            echo "Frontend deployment completed."
          EOF

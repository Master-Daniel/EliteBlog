name: Elite-Blog Frontend Deployment

on:
  push:
    branches:
      - frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: frontend-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            frontend-node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -d node_modules ] && [ -f package-lock.json ]; then
            echo "Restored node_modules from cache; running npm install (quick sync)..."
            npm install --prefer-offline --no-audit --no-fund
          else
            echo "Full install; npm install..."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build
        env:
          CI: 'true'

      - name: Add SSH key for deploy (optional private deps)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

  deploy_production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/frontend' || github.ref == 'refs/heads/frontend_v1.0'
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      DEPLOY_PATH: /var/www/elite-blog/frontend

    steps:
      - name: Add SSH key for deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Verify SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'echo "SSH connection successful"'

      - name: Deploy to Production
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "TARGET_BRANCH=$TARGET_BRANCH DEPLOY_PATH=$DEPLOY_PATH REPO=${{ github.repository }} DEPLOY_USER=${{ secrets.SSH_USER }} bash -s" << 'EOF'
            set -e
            echo "Deploying Elite-Blog frontend to $DEPLOY_PATH on branch $TARGET_BRANCH"

            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              echo "First-time deployment - cloning repository (public)..."
              sudo mkdir -p "${DEPLOY_PATH}"
              sudo git clone "https://github.com/${REPO}.git" "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
              sudo git checkout "${TARGET_BRANCH}"
              echo "Repository cloned."
            else
              cd "${DEPLOY_PATH}"
            fi

            sudo git config --global --add safe.directory "${DEPLOY_PATH}" || true
            sudo git fetch origin "${TARGET_BRANCH}"
            sudo git reset --hard "origin/${TARGET_BRANCH}"
            sudo git clean -fd

            sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} "${DEPLOY_PATH}" 2>/dev/null || true

            if [ -x "${DEPLOY_PATH}/scripts/deploy-orchestrator.sh" ]; then
              cd "${DEPLOY_PATH}" && ./scripts/deploy-orchestrator.sh production
            else
              cd "${DEPLOY_PATH}" && npm ci && npm run build
              echo "Frontend build done. Copy dist/ to your web server root (e.g. FRONTEND_WEB_ROOT)."
            fi
            echo "Frontend deployment completed."
          EOF
